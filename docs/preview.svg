<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="A reading workbench: books on a shelf, an annotated PDF page, and a side conversation">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#12202b" flood-opacity=".12"/>
    </filter>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12202b"/>
      <stop offset="1" stop-color="#2a4a5e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#2f6df6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="640" height="300" rx="18" fill="#f6f8fa"/>

  <!-- shelf / books -->
  <g filter="url(#soft)">
    <rect x="42" y="66" width="86" height="150" rx="7" fill="#ffffff" stroke="#dbe3e9"/>
    <rect x="53" y="78" width="64" height="88" rx="4" fill="url(#cover)"/>
    <path d="M62 96h46M62 106h34" stroke="#8fa9b9" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <circle cx="85" cy="132" r="13" fill="none" stroke="#5b8cff" stroke-width="2" opacity=".8"/>
    <rect x="59" y="180" width="52" height="5" rx="2.5" fill="#cfd9e1"/>
    <rect x="59" y="191" width="34" height="5" rx="2.5" fill="#e2e8ed"/>

    <rect x="142" y="86" width="86" height="130" rx="7" fill="#ffffff" stroke="#dbe3e9"/>
    <rect x="153" y="98" width="64" height="78" rx="4" fill="#eef3f7" stroke="#d7e0e7"/>
    <path d="M166 118h38M166 127h26" stroke="#aab8c3" stroke-width="3" stroke-linecap="round"/>
    <path d="M166 148c8-14 14-16 18-8 4 7 8 8 14 1" fill="none" stroke="#2f6df6" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="159" y="192" width="52" height="5" rx="2.5" fill="#cfd9e1"/>
    <rect x="159" y="203" width="30" height="5" rx="2.5" fill="#e2e8ed"/>
  </g>

  <!-- page -->
  <g filter="url(#soft)">
    <rect x="258" y="38" width="200" height="222" rx="10" fill="#ffffff" stroke="#dfe6ec"/>
    <rect x="274" y="56" width="168" height="6" rx="3" fill="#c9d4dd"/>
    <rect x="274" y="72" width="120" height="6" rx="3" fill="#e2e8ee"/>
    <rect x="274" y="94" width="150" height="5" rx="2.5" fill="#dde5eb"/>
    <rect x="274" y="106" width="160" height="5" rx="2.5" fill="#dde5eb"/>
    <rect x="274" y="118" width="132" height="5" rx="2.5" fill="#dde5eb"/>
    <rect x="274" y="136" width="156" height="5" rx="2.5" fill="#dde5eb"/>
    <rect x="274" y="148" width="144" height="5" rx="2.5" fill="#dde5eb"/>

    <!-- ink mark -->
    <path d="M286 196c12-22 24-27 32-16 7 9 12 11 20 2 8-9 16-3 19 8 2 8 10 9 18 3" fill="none" stroke="#2f6df6" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M296 218c18-2 38-2 56 0" fill="none" stroke="#12202b" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>

    <!-- selection box -->
    <rect x="316" y="174" width="88" height="54" rx="4" fill="#2f6df6" fill-opacity=".05" stroke="#2f6df6" stroke-width="1.4" stroke-dasharray="5 4"/>

    <!-- corner plus handles -->
    <g fill="#ffffff" stroke="#2f6df6" stroke-width="1.3">
      <rect x="352" y="28" width="12" height="12" rx="2"/>
      <rect x="352" y="258" width="12" height="12" rx="2"/>
      <rect x="248" y="143" width="12" height="12" rx="2"/>
      <rect x="456" y="143" width="12" height="12" rx="2"/>
    </g>
    <g stroke="#2f6df6" stroke-width="1.5" stroke-linecap="round">
      <path d="M358 31v6M355 34h6M358 261v6M355 264h6M251 146v6M248 149h6M459 146v6M456 149h6"/>
    </g>
  </g>

  <!-- conversation -->
  <g filter="url(#soft)">
    <rect x="486" y="72" width="118" height="154" rx="12" fill="#ffffff" stroke="#dfe6ec"/>
    <circle cx="508" cy="96" r="9" fill="#12202b"/>
    <path d="M504.5 96l2.5 2.5 4.5-5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="524" y="91" width="52" height="6" rx="3" fill="#cfd9e1"/>
    <rect x="502" y="116" width="84" height="5" rx="2.5" fill="#e1e8ee"/>
    <rect x="502" y="128" width="70" height="5" rx="2.5" fill="#e1e8ee"/>
    <rect x="502" y="140" width="78" height="5" rx="2.5" fill="#e1e8ee"/>

    <rect x="502" y="164" width="72" height="42" rx="10" fill="#2f6df6" fill-opacity=".1" stroke="#2f6df6" stroke-opacity=".25"/>
    <rect x="512" y="176" width="50" height="4" rx="2" fill="#2f6df6" opacity=".55"/>
    <rect x="512" y="186" width="36" height="4" rx="2" fill="#2f6df6" opacity=".35"/>

    <path d="M536 212c0 6-6 10-13 10l-9 6 2-9c-4-2-6-5-6-9 0-7 7-12 13-12s13 5 13 14z" fill="#12202b"/>
  </g>

  <!-- baseline accents -->
  <path d="M42 266h556" stroke="#e1e7ec" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="42" cy="266" r="3" fill="#2f6df6"/>
  <circle cx="598" cy="266" r="3" fill="#cfd9e1"/>
</svg>
